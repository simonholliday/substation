# Band library: the templates and bands shipped with Substation.
#
# Hand-written, and included as it is at the end of config.yaml.default by
# `python -m substation.generate_default_config`, after the settings that
# script generates from substation/config.py.  Edit the bands here, then run
# the script.
#
# Every band has a reception_class, which says how UK law treats listening to
# it, and decides whether it records when it does not set recording_enabled:
#   general      what Ofcom calls general reception: licensed broadcasting,
#                amateur and CB radio, and weather and navigation
#                transmissions.  These bands record.
#   not_general  services outside general reception, which Ofcom says it is
#                illegal to listen to.  These bands only detect activity.
#   unsettled    bands where the position is unclear, such as civil airband.
#                These also only detect activity.
# This describes UK law and is not legal advice.  Where your own law allows
# it, set recording_enabled: true for a band in your config.yaml.

band_defaults:

    # Generic narrow-FM voice bands (UHF business radio, amateur 2m,
    # marine VHF, fire ground, etc.).  Each band sets its own
    # channel_spacing because conventions differ between services.
    # Most are not general reception; amateur_2m, which is, says so.
    NFM:
        modulation: NFM
        reception_class: not_general

    # Default settings for PMR bands
    PMR:
        channel_spacing: 12.5e+3
        modulation: NFM
        reception_class: not_general
        snr_threshold_db: 4.5
        sdr_gain_db: 36

    # Default settings for DMR bands
    DMR:
        channel_spacing: 12.5e+3
        modulation: NFM
        reception_class: not_general
        snr_threshold_db: 15
        sdr_gain_db: 24

    # Default settings for airband voice (AM).  Civil airband is
    # unsettled: Ofcom will not say that listening to it is an offence.
    # Military airband, which is not general reception, says so.
    AIR:
        channel_spacing: !fraction 25000/3
        modulation: AM
        reception_class: unsettled
        snr_threshold_db: 4.5
        sdr_gain_db: 30

    # TETRA: detection only, with no demodulator.
    # Bands using this type detect radio channel activity but cannot record audio.
    # The uplink frequency for a given radio channel sits 10 MHz below the paired
    # downlink frequency.
    TETRA:
        channel_spacing: 25.0e+3
        modulation: TETRA
        reception_class: not_general
        snr_threshold_db: 3.5
        sdr_gain_db: 36

    # HF / shortwave on AirSpy HF+ Discovery.
    # Each HF band sets its own reception_class, and its own modulation
    # (USB / LSB / AM) explicitly, because both depend on the band's content:
    #   - 80m, 40m  → LSB by amateur convention (below 10 MHz)
    #   - 20m, 17m, 15m, 12m, 10m, HFGCS, VOLMET → USB (above 10 MHz)
    #   - International broadcast and pirate radio → AM
    # Radio channel spacing of 5 kHz comfortably contains a single ~2.7 kHz
    # SSB transmission per radio channel.
    HF:
        channel_spacing: 5.0e+3
        snr_threshold_db: 6
        sdr_gain_db: auto

    # Citizens Band 27 MHz - NFM voice, 10 kHz spacing.
    CB:
        channel_spacing: 10.0e+3
        modulation: NFM
        reception_class: general
        snr_threshold_db: 4.5
        sdr_gain_db: 36

    # Digital data bands (ACARS, VDL Mode 2, etc.).  Detection only -
    # there is no demodulator for these protocols.  Messages between
    # aircraft and the ground are not among the transmissions Ofcom
    # lists as general reception.
    DATA:
        reception_class: not_general

bands:

    # Practical maximum sample rates:
    # - RTL-SDR Blog V4: 2.4MHz
    # - HackRF One: 16MHz
    # - AirSpy R2: 10MHz
    # - AirSpy HF+ Discovery: 912kHz

    pmr:
        type: PMR
        freq_start: 446.00625e+6
        freq_end: 446.19375e+6
        sample_rate: 1.024e6

    # Air

    air_civil_1:
        type: AIR
        freq_start: 118.0e+6
        freq_end: 127.5e+6
        sample_rate: 12.5e+6

    air_civil_2:
        type: AIR
        freq_start: 127.5e+6
        freq_end: 137.0e+6
        sample_rate: 12.5e+6

    # Specific Bristol/Local Area (Faster scanning)

    air_civil_bristol:
        type: AIR
        freq_start: 125.5e+6
        freq_end: 126.0e+6
        sample_rate: 1.024e6
        exclude_channel_indices: [26, 27, 34, 35]
        device_overrides:
            # AirSpy HF+ Discovery - sensitive narrow-band receiver.
            # The HF+ is sensitive enough that the standard SNR threshold
            # catches stationary noise as well as real signals;
            # activation_variance_db filters out those noise triggers.
            airspyhf:
                sample_rate: 0.912e6
                snr_threshold_db: 6
                sdr_gain_db: auto
                activation_variance_db: 3.0

    # UK Military Airband
    # This is the whole allocation, which is far wider than any receiver can
    # hear at once: scanning it needs a copy narrowed to the part you want.
    air_military_uhf:
        type: AIR
        reception_class: not_general
        freq_start: 225.0e+6
        freq_end: 400.0e+6
        channel_spacing: 25.0e+3
        sample_rate: 2.4e+6
        sdr_gain_db: 36

    # ACARS Digital Data (Standard)
    air_acars_primary:
        type: DATA
        freq_start: 131.5e+6
        freq_end: 131.9e+6
        channel_spacing: 25.0e+3
        sample_rate: 1.0e+6
        modulation: AM
        snr_threshold_db: 15
        sdr_gain_db: 36

    # VDL Mode 2 (High-speed Digital Aviation Data)
    air_vdl_m2:
        type: DATA
        freq_start: 136.9e+6
        freq_end: 136.975e+6
        channel_spacing: 25.0e+3
        sample_rate: 1.0e+6
        modulation: AM
        snr_threshold_db: 15
        sdr_gain_db: 36

    # Fire Ground Simplex (analogue - used at scene of incidents)
    fire_ground_uhf:
        type: NFM
        freq_start: 457.0e+6
        freq_end: 457.5e+6
        channel_spacing: 12.5e+3
        sample_rate: 1.0e+6
        modulation: NFM
        snr_threshold_db: 15
        sdr_gain_db: 24

    # Amateur Radio 2m Band (UK)
    amateur_2m:
        type: NFM
        reception_class: general
        freq_start: 144.0e+6
        freq_end: 146.0e+6
        channel_spacing: 12.5e+3
        sample_rate: 2.4e+6
        modulation: NFM
        snr_threshold_db: 4.5
        sdr_gain_db: 36

    # Marine VHF (focus on the international calling radio channel, 16)
    marine_vhf_calling:
        type: NFM
        freq_start: 156.0e+6
        freq_end: 157.4e+6
        channel_spacing: 25.0e+3  # Marine can be 12.5 or 25, 25 is common for older gear
        sample_rate: 2.4e+6
        modulation: NFM
        snr_threshold_db: 5.0
        sdr_gain_db: 30

    # UK Simple Business Radio (UHF)
    business_simple_uk_uhf:
        type: NFM
        freq_start: 449.3e+6
        freq_end: 449.5e+6
        channel_spacing: 12.5e+3
        sample_rate: 1.024e+6
        modulation: NFM
        snr_threshold_db: 6.0
        sdr_gain_db: 36

    # -----------------------------------------------------------------
    # DMR (UK)
    # -----------------------------------------------------------------

    # All UK DMR - requires high-bandwidth device (e.g. HackRF)
    dmr:
        type: DMR
        freq_start: 452.5e+6
        freq_end: 460.5e+6
        sample_rate: 12.5e+6

    # DMR slices for RTL-SDR (2.4 MHz bandwidth limit)
    dmr_1:
        type: DMR
        freq_start: 452.5e+6
        freq_end: 454.5e+6
        sample_rate: 2.4e+6

    dmr_2:
        type: DMR
        freq_start: 457.5e+6
        freq_end: 459.5e+6
        sample_rate: 2.4e+6

    dmr_3:
        type: DMR
        freq_start: 458.5e+6
        freq_end: 460.5e+6
        sample_rate: 2.4e+6

    dmr_4:
        type: DMR
        freq_start: 453.0e+6
        freq_end: 453.3e+6
        sample_rate: 2.4e+6

    dmr_5:
        type: DMR
        freq_start: 455.0e+6
        freq_end: 457.0e+6
        sample_rate: 2.4e+6

    # -----------------------------------------------------------------
    # TETRA / Airwave (UK)
    # -----------------------------------------------------------------

    # Airwave Downlink (always-on)

    tetra_airwave_downlink:
        type: TETRA
        freq_start: 390.0e+6
        freq_end: 395.0e+6
        sample_rate: 10.0e+6

    tetra_airwave_downlink_1:
        type: TETRA
        freq_start: 390.0e+6
        freq_end: 391.9e+6
        sample_rate: 2.4e+6

    tetra_airwave_downlink_2:
        type: TETRA
        freq_start: 391.5e+6
        freq_end: 393.4e+6
        sample_rate: 2.4e+6

    tetra_airwave_downlink_3:
        type: TETRA
        freq_start: 393.1e+6
        freq_end: 395.0e+6
        sample_rate: 2.4e+6

    # Airwave Uplink

    tetra_airwave_uplink:
        type: TETRA
        freq_start: 380.0e+6
        freq_end: 385.0e+6
        sample_rate: 10.0e+6

    tetra_airwave_uplink_1:
        type: TETRA
        freq_start: 380.0e+6
        freq_end: 381.9e+6
        sample_rate: 2.4e+6

    tetra_airwave_uplink_2:
        type: TETRA
        freq_start: 381.5e+6
        freq_end: 383.4e+6
        sample_rate: 2.4e+6

    tetra_airwave_uplink_3:
        type: TETRA
        freq_start: 383.1e+6
        freq_end: 385.0e+6
        sample_rate: 2.4e+6

    # London-only Emergency Services Extensions
    # Wider than its own sample rate covers: scanning it needs a copy split
    # into parts, or a higher sample rate on a receiver that reaches one.

    tetra_london_extension:
        type: TETRA
        freq_start: 420.0e+6
        freq_end: 423.0e+6
        sample_rate: 2.4e+6

    # Commercial Downlink

    tetra_commercial_downlink:
        type: TETRA
        freq_start: 420.0e+6
        freq_end: 425.0e+6
        sample_rate: 10.0e+6

    tetra_commercial_downlink_1:
        type: TETRA
        freq_start: 420.0e+6
        freq_end: 421.9e+6
        sample_rate: 2.4e+6

    tetra_commercial_downlink_2:
        type: TETRA
        freq_start: 421.5e+6
        freq_end: 423.4e+6
        sample_rate: 2.4e+6

    tetra_commercial_downlink_3:
        type: TETRA
        freq_start: 423.1e+6
        freq_end: 425.0e+6
        sample_rate: 2.4e+6

    # Commercial Uplink

    tetra_commercial_uplink:
        type: TETRA
        freq_start: 410.0e+6
        freq_end: 420.0e+6
        sample_rate: 16.0e+6

    # Prison/Civil (450-462.4 MHz)

    tetra_prison_civil:
        type: TETRA
        freq_start: 450.0e+6
        freq_end: 462.4e+6
        sample_rate: 16.0e+6

    tetra_prison_civil_1:
        type: TETRA
        freq_start: 450.0e+6
        freq_end: 451.9e+6
        sample_rate: 2.4e+6

    tetra_prison_civil_2:
        type: TETRA
        freq_start: 451.5e+6
        freq_end: 453.4e+6
        sample_rate: 2.4e+6

    tetra_prison_civil_3:
        type: TETRA
        freq_start: 453.1e+6
        freq_end: 455.0e+6
        sample_rate: 2.4e+6

    tetra_prison_civil_4:
        type: TETRA
        freq_start: 454.6e+6
        freq_end: 456.5e+6
        sample_rate: 2.4e+6

    tetra_prison_civil_5:
        type: TETRA
        freq_start: 456.1e+6
        freq_end: 458.0e+6
        sample_rate: 2.4e+6

    tetra_prison_civil_6:
        type: TETRA
        freq_start: 457.7e+6
        freq_end: 459.6e+6
        sample_rate: 2.4e+6

    tetra_prison_civil_7:
        type: TETRA
        freq_start: 459.2e+6
        freq_end: 461.1e+6
        sample_rate: 2.4e+6

    tetra_prison_civil_8:
        type: TETRA
        freq_start: 460.8e+6
        freq_end: 462.4e+6
        sample_rate: 2.4e+6

    # -----------------------------------------------------------------
    # HF / Shortwave (for AirSpy HF+ Discovery or similar)
    # -----------------------------------------------------------------
    #
    # Amateur voice, which records out of the box, and numbers stations,
    # military, utility and pirate transmissions, which UK law does not
    # open to general reception, so those bands only detect activity.
    # All bands deliberately AVOID ITU international broadcast windows so
    # they will not pick up music or news stations.
    #
    # Each band specifies its own modulation explicitly (USB, LSB, or AM)
    # so the demodulator matches what's actually being transmitted.
    #
    # Time-of-day guide:
    #   Night     →  hf_amateur_80m, hf_night_4mhz
    #   Day       →  hf_day_11mhz,    hf_amateur_20m
    #   Anytime   →  hf_amateur_40m
    #   Sun morn  →  hf_pirate_48m
    #
    # SAMPLE RATES: the values below are deliberately wide enough to
    # cover the full band of interest in a single tune.  If CPU load is
    # a concern, narrowing each band's freq_start/freq_end and dropping
    # to a smaller AirSpy HF+ supported rate (192 / 228 / 384 / 456 /
    # 650 / 768 / 912 kHz) would reduce per-slice work proportionally.

    # 80m amateur phone - European LSB voice, many languages, night band.
    hf_amateur_80m:
        type: HF
        reception_class: general
        modulation: LSB
        freq_start: 3.600e+6
        freq_end: 3.800e+6
        sample_rate: 0.228e6

    # 4 MHz night band - UVB-76 "The Buzzer" (4625), HFGCS night (4724),
    # marine SSB (4125), Russian/CIS military voice activity.
    # Default modulation is USB because most of the traffic in this
    # window (HFGCS, marine SSB) is USB-modulated.  UVB-76 itself is
    # technically full-carrier AM - it will still be audible through
    # the USB demodulator (the buzz tone is intelligible in any
    # demodulator), but if you prefer cleaner UVB-76 capture switch
    # this band to modulation: AM.
    # activation_variance_db is lowered to 1.0 so UVB-76's slow buzz
    # pattern crosses the threshold (the default 3.0 would suppress it).
    hf_night_4mhz:
        type: HF
        reception_class: not_general
        modulation: USB
        freq_start: 4.100e+6
        freq_end: 4.750e+6
        sample_rate: 0.768e6
        activation_variance_db: 1.0

    # European pirate radio window (48m) - operators in NL/DE dominant,
    # peak activity Sunday mornings 09:00-11:00 UTC.  Hot zone 6225-6280.
    # Pirates traditionally broadcast in AM (which is part of why they
    # have that distinctive "old radio" sound), so this is the one HF
    # band where AM is the *correct* default rather than the "weird
    # sampling" choice.
    hf_pirate_48m:
        type: HF
        reception_class: not_general
        modulation: AM
        freq_start: 6.200e+6
        freq_end: 6.400e+6
        sample_rate: 0.228e6

    # 40m amateur phone - busiest amateur band globally, LSB voice
    # (amateur convention below 10 MHz), usable day and night with
    # different skip distances.
    hf_amateur_40m:
        type: HF
        reception_class: general
        modulation: LSB
        freq_start: 7.100e+6
        freq_end: 7.200e+6
        sample_rate: 0.192e6

    # 11 MHz day band - HFGCS US Air Force day frequency (11175 USB,
    # the busy one with most Skyking traffic), Shannon VOLMET aviation
    # weather (11253 USB), naval weather FAX (11086.5).  All USB.
    # The weather broadcasts are general reception, but HFGCS is military,
    # so the band as a whole is not.
    hf_day_11mhz:
        type: HF
        reception_class: not_general
        modulation: USB
        freq_start: 10.950e+6
        freq_end: 11.550e+6
        sample_rate: 0.768e6

    # 20m amateur phone - premier daytime DX band, international USB
    # voice (amateur convention above 10 MHz), maximum language
    # variety when propagation is open.
    hf_amateur_20m:
        type: HF
        reception_class: general
        modulation: USB
        freq_start: 14.150e+6
        freq_end: 14.350e+6
        sample_rate: 0.228e6

    # UK CB 27/81 - primary UK allocation, 40 radio channels, FM only.
    # Radio channel 9 (27.68125 MHz) is the emergency radio channel.
    # Radio channel 14 (27.73125 MHz) is the calling radio channel.
    cb_uk:
        type: CB
        freq_start: 27.60125e+6
        freq_end: 27.99125e+6
        sample_rate: 0.768e6

    # CEPT/EU CB - extended European allocation, 40 radio channels.
    # AM, FM, and SSB permitted.  Modulation set to NFM as the
    # most common voice mode; AM activity also occurs.
    cb_cept:
        type: CB
        freq_start: 26.965e+6
        freq_end: 27.405e+6
        sample_rate: 0.768e6

