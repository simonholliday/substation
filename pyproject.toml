[build-system]
# setuptools 81 removed pkg_resources, which several of our runtime
# dependencies still import.  Pin below 81 until they catch up.  The >=77
# floor is required for the PEP 639 SPDX `license` string form below.
requires = ["setuptools>=77,<81", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "substation"
dynamic = ["version"]
description = "A versatile SDR band scanner for RTL-SDR, HackRF, AirSpy, and SoapySDR devices"
authors = [
    { name = "Simon Holliday", email = "simon.holliday@protonmail.com" }
]
# SPDX expression (PEP 639).  The old table form and the License:: classifier
# are deprecated by setuptools; the SPDX string is now the single source of
# truth for the license.
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["sdr", "radio", "scanner", "rtl-sdr", "hackrf", "airspy", "soapysdr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0",
    # pyrtlsdr 0.4.0+ requires the rtlsdr_set_dithering symbol from the
    # rtl-sdr-blog fork.  Pinning below 0.4.0 keeps the package working
    # against distro-packaged librtlsdr too — see INSTALL.md for
    # the fork build instructions.
    "pyrtlsdr>=0.3.0,<0.4.0",
    "python_hackrf",
    "noisereduce>=3.0.3",
    "PyYAML>=6.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.1",
    "mutagen>=1.45",
    # SoapySDR (for AirSpy and other devices) is a system package — install
    # via apt (python3-soapysdr) and use --system-site-packages on the venv.
    # See INSTALL.md section 4.
]

[project.optional-dependencies]
# Development tools — install with `pip install -e ".[dev]"`.
# pytest is used for the test suite; mypy for the type-check pass.
# mypy is pinned below 1.18 because
# newer releases ship a C-accelerated backend (librt) that segfaults
# on aarch64 (Raspberry Pi) at time of writing.
dev = [
    "pytest>=7.0",
    "mypy>=1.0,<1.18",
    # Type stubs for PyYAML — without these `mypy substation` fails on
    # the yaml import in a fresh dev install.
    "types-PyYAML",
]

# OSC event forwarding — install with `pip install -e ".[osc]"`.
# Enables substation.osc_sender.OscEventSender to bridge scanner
# callbacks onto UDP OSC messages (e.g. Subsequence sequencer on
# port 9000, Subsample sampler on port 9002).  See README section
# "OSC event forwarding" for the wire format and address table.
osc = [
    "python-osc>=1.8",
]

# Note: the Supervisor dashboard is NOT an extra here.  Its package is only
# distributed from GitHub, and PyPI rejects any distribution whose
# dependencies (including extras) are direct URLs — so a `supervisor` extra
# pointing at git+https would block publishing substation to PyPI.  The
# scanner lazy-imports supervisor and warns if it is absent, so it stays an
# optional add-on you install separately:
#     pip install git+https://github.com/simonholliday/supervisor.git
# See INSTALL.md and the README "Supervisor dashboard" section.

[project.urls]
Repository = "https://github.com/simonholliday/substation"
Issues = "https://github.com/simonholliday/substation/issues"

[project.scripts]
substation = "substation.cli:main"
substation-antenna = "substation.antenna:main"

[tool.setuptools.packages.find]
include = ["substation*"]

[tool.setuptools.package-data]
# Ship the default configuration inside the package so it resolves for
# editable installs and wheels alike (see config._locate_default_config).
substation = ["config.yaml.default"]

[tool.setuptools_scm]
# Version is derived from git release tags (vX.Y.Z), same as the other
# Sub* projects.  Between tags, setuptools-scm generates a dev version
# from the latest tag plus commit distance.  Re-run `pip install -e .`
# after tagging to refresh the installed metadata.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
# Keep mypy strict on our own code.  We only add per-module overrides
# below to silence "library stubs not installed" errors for third-party
# packages that don't ship PEP 561 stubs — scipy, SoapySDR, rtlsdr,
# noisereduce, and soundfile.  Using per-module overrides instead of a
# global `ignore_missing_imports = true` keeps accidental typos in local
# imports visible as errors.
python_version = "3.10"

[[tool.mypy.overrides]]
module = [
    "scipy",
    "scipy.fft",
    "scipy.ndimage",
    "scipy.signal",
    "SoapySDR",
    "rtlsdr",
    "mutagen",
    "noisereduce",
    "soundfile",
    "supervisor",
    "supervisor.app",
    "supervisor.app.substation",
    # python-osc is an optional [osc] extra, so it may legitimately be
    # absent when type-checking the base package.
    "pythonosc",
    "pythonosc.udp_client",
]
ignore_missing_imports = true
